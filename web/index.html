<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoHo AI – Ghi sổ</title>
<style>
  :root { --bg:#0f1720; --panel:#17222e; --line:#243342; --text:#e8eef5; --muted:#8fa3b8; --accent:#1abc9c; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  #log { display:flex; flex-direction:column; gap:10px; min-height:220px; margin-bottom:16px; }
  .msg { padding:10px 13px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .me { background:#1f6feb; align-self:flex-end; max-width:85%; }
  .bot { background:var(--panel); border:1px solid var(--line); align-self:flex-start; max-width:92%; }
  .err { background:#3d1d1d; border:1px solid #5c2b2b; }
  form { display:flex; gap:8px; }
  textarea { flex:1; resize:vertical; min-height:52px; padding:12px; border-radius:10px; border:1px solid var(--line);
             background:var(--panel); color:var(--text); font:inherit; }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#07211c;
           font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .actions { display:flex; gap:8px; margin-top:10px; }
  .actions button { padding:9px 16px; }
  .ghost { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:500; }
  .hint { color:var(--muted); font-size:12.5px; margin-top:14px; }
  code { background:#0b1218; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SoHo AI — ghi sổ tự động</h1>
  <div class="sub">Gõ tin nhắn, AI bóc thành bút toán, bạn xác nhận rồi mới ghi vào sổ.</div>

  <div id="log"></div>

  <form id="f">
    <textarea id="in" placeholder="p304 tt 1.480.000 chi soho&#10;hoặc dán nhiều dòng..." required></textarea>
    <button id="send" type="submit">Gửi</button>
  </form>

  <div class="actions" id="actions" hidden>
    <button id="commit">✅ Ghi sổ</button>
    <button id="cancel" class="ghost">❌ Huỷ</button>
  </div>

  <div class="hint">
    Ví dụ: <code>chi 159k cước hotline soho, thu 1tr2 hoàn ứng tm</code><br>
    Nhiều dòng: dán cả khối, mỗi dòng một bút toán.
  </div>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('in');
const form = document.getElementById('f');
const actions = document.getElementById('actions');
const sessionId = 'web-' + Math.random().toString(36).slice(2, 10);

function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  d.scrollIntoView({ block: 'end', behavior: 'smooth' });
}

async function post(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' — ' + (await r.text()).slice(0, 200));
  return r.json();
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  add(text, 'me');
  input.value = '';
  actions.hidden = true;
  try {
    const data = await post('/api/chat', { session_id: sessionId, text });
    add(data.reply, 'bot');
    actions.hidden = !(data.items && data.items.length);
  } catch (err) {
    add('⚠️ ' + err.message, 'bot err');
  }
});

document.getElementById('commit').addEventListener('click', async () => {
  try {
    const data = await post('/api/commit', { session_id: sessionId });
    add(data.reply, 'bot');
  } catch (err) {
    add('⚠️ ' + err.message, 'bot err');
  }
  actions.hidden = true;
});

document.getElementById('cancel').addEventListener('click', async () => {
  const data = await post('/api/cancel', { session_id: sessionId });
  add(data.reply, 'bot');
  actions.hidden = true;
});

add('Chào bạn 👋 Gõ một bút toán để thử, ví dụ: p304 tt 1.480.000 chi soho', 'bot');
</script>
</body>
</html>
